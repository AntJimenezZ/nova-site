fragment ProjectsParts on Projects {
  __typename
  items {
    __typename
    slug
    title
    summary
    description
    image
    imageKind
    year
    category
    tech
    longDescription
    features
    outcomes
    metrics {
      __typename
      label
      value
    }
    role
    duration
    client
    links {
      __typename
      demo
      repo
    }
  }
}

fragment ServicesParts on Services {
  __typename
  services {
    __typename
    slug
    icon
    title
    summary
    description
    features
    tech
  }
  capabilities {
    __typename
    icon
    title
    description
    tags
  }
}

fragment TeamParts on Team {
  __typename
  members {
    __typename
    name
    role
    bio
    avatar
    technologies
  }
}

fragment TestimonialsParts on Testimonials {
  __typename
  items {
    __typename
    id
    name
    company
    role
    comment
    rating
    projectTitle
  }
}
